services:
  db:
    image: postgres:16-alpine
    container_name: jaza_kikapu_db
    environment:
      POSTGRES_DB: jaza_kikapu
      POSTGRES_USER: jaza_admin
      POSTGRES_PASSWORD: jaza_secure_password_voi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaza_admin -d jaza_kikapu"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jaza_kikapu_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      target: backend
    container_name: jaza_kikapu_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://jaza_admin:jaza_secure_password_voi@db:5432/jaza_kikapu
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=prod_taita_taveta_voi_market_secret_key_99182
      - MPESA_SHORTCODE=174379
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build:
      context: .
      target: backend
    container_name: jaza_kikapu_celery
    command: celery -A jaza_core worker -l info
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: .
      target: frontend-builder
    container_name: jaza_kikapu_frontend
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws

volumes:
  postgres_data:
